services:
  # Web 服务
  web:
    build:
      context: ./backend
      dockerfile: ./backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./flight_scraper.db
      - APPIUM_SERVER_URL=http://host.docker.internal:4723
      - SCRAPER_DEVICE_UDID=emulator-5554
    volumes:
      - ./data:/app/data
      - ./backend:/app
      - ./scripts:/app/scripts
      - ./results:/app/results
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend 服务
  frontend:
    build:
      context: ./frontend
      dockerfile: ./frontend.Dockerfile
      args:
        - VITE_API_BASE=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - web
    networks:
      - app-network
    environment:
      - VITE_API_BASE=http://localhost:8000

  # Android 模拟器服务
  android-emulator:
    image: budtmo/docker-android:emulator_11.0
    privileged: true
    ports:
      - "5555:5555"  # ADB
      - "6080:6080"  # VNC
    environment:
      - EMULATOR_DEVICE=Samsung Galaxy S10
      - WEB_VNC=true
      - VNC_PASSWORD=password
    volumes:
      - android_data:/root/.android
    networks:
      - app-network

  # Appium 服务
  appium:
    build:
      context: ./backend
      dockerfile: ./appium.Dockerfile
    ports:
      - "4723:4723"
    depends_on:
      - android-emulator
    environment:
      - ANDROID_HOME=/opt/android-sdk
      - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
      - ADB_SERVER_HOST=host.docker.internal
      - ADB_SERVER_PORT=5037
    volumes:
      - ./scripts:/app/scripts
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4723/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 航班抓取服务
  flight-scraper:
    build:
      context: ./backend
      dockerfile: ./scraper.Dockerfile
    depends_on:
      - web
      - appium
    environment:
      - API_BASE_URL=http://web:8000
      - APPIUM_SERVER_URL=http://appium:4723
    volumes:
      - ./scripts:/app/scripts
      - ./results:/app/results
    networks:
      - app-network
    profiles:
      - scraper


  # Nginx 反向代理 (可选)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #     - ./ssl:/etc/nginx/ssl
  #   depends_on:
  #     - web
  #     - frontend
  #   networks:
  #     - app-network

volumes:
  android_data:

networks:
  app-network:
    driver: bridge