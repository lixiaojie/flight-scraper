services:
  # Web 服务
  web:
    build:
      context: ./backend
      dockerfile: ./backend.Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./flight_scraper.db
      - DATABASE_LOCATION=root
      - SCRAPER_CONFIG_PATH=/app/scripts/config/scraper.config.json
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - ANDROID_ADB_SERVER_HOST=host.docker.internal
      - ANDROID_ADB_SERVER_PORT=5037
      - ADB_HOST=host.docker.internal
      - ADB_PORT=5037
    volumes:
      - ./data:/app/data
      - ./backend:/app
      - ./scripts:/app/scripts
      - ./results:/app/results
      - ./assets:/app/assets
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend 服务
  frontend:
    build:
      context: ./frontend
      dockerfile: ./frontend.Dockerfile
      args:
        - VITE_API_BASE=http://localhost:8000
        - BUILDKIT_INLINE_CACHE=1
    ports:
      - "3002:3000"
    depends_on:
      - web
    networks:
      - app-network
    environment:
      - VITE_API_BASE=http://localhost:8000

  # Appium 服务
  appium:
    build:
      context: ./backend
      dockerfile: ./appium.Dockerfile
    ports:
      - "4723:4723"
    depends_on: []
    environment:
      - ANDROID_HOME=/opt/android-sdk
      - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
      - ANDROID_ADB_SERVER_HOST=host.docker.internal
      - ANDROID_ADB_SERVER_PORT=5037
      - ADB_SERVER_SOCKET=tcp:host.docker.internal:5037
      - ADB_HOST=host.docker.internal
      - ADB_PORT=5037
      - ADB_CONNECT_TARGET=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./scripts:/app/scripts
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4723/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 航班抓取服务
  flight-scraper:
    build:
      context: ./backend
      dockerfile: ./scraper.Dockerfile
    depends_on:
      - web
      - appium
    environment:
      - API_BASE_URL=http://web:8000
      - SCRAPER_CONFIG_PATH=/app/scripts/config/scraper.config.json
      - ZAI_API_KEY=${ZAI_API_KEY:-}
    volumes:
      - ./scripts:/app/scripts
      - ./results:/app/results
      - ./assets:/app/assets
    networks:
      - app-network
    profiles:
      - scraper


  # Nginx 反向代理 (可选)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #     - ./ssl:/etc/nginx/ssl
  #   depends_on:
  #     - web
  #     - frontend
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge