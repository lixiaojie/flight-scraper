error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;
    
    # 确保正确处理HTTP请求
    server_tokens off;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    
    server {
        listen 3000;
        server_name _;
        
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        charset utf-8;
        
        # 禁用不必要的功能以提高稳定性
        gzip off;
        
        # 前端路由
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff";
            add_header X-Frame-Options "SAMEORIGIN";
        }
        
        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # API代理 - 使用Docker网络中的web服务
        location /api {
            proxy_pass http://web:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            # 使用 $http_host 保留端口（如 localhost:3002），避免后端 307 重定向到 http://localhost/... 导致 ERR_CONNECTION_REFUSED
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_buffering off;
            # 重写后端返回的 Location，把无端口的 localhost 改为当前端口
            proxy_redirect ~^http://localhost/(.*)$ $scheme://$http_host/$1;
            proxy_redirect ~^https://localhost/(.*)$ $scheme://$http_host/$1;
        }
        
        # 代理其他后端路径
        location ~ ^/(docs|openapi\.json|health) {
            proxy_pass http://web:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # 错误页面
        error_page 404 /index.html;
    }
}
