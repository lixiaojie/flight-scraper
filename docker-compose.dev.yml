# 开发模式Docker Compose配置 - 使用本地依赖缓存
services:
  # Web 服务 (开发模式)
  web:
    build:
      context: ./backend
      dockerfile: ./backend.Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./flight_scraper.db
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
      - ./backend:/app
      - python_cache:/cache  # Python依赖缓存
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend 服务 (开发模式)
  frontend:
    build:
      context: ./frontend
      dockerfile: ./frontend.Dockerfile.dev
    ports:
      - "3000:3000"
    depends_on:
      - web
    networks:
      - app-network
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - node_cache:/cache  # Node.js依赖缓存
      - /app/node_modules  # 防止覆盖容器内的node_modules

  # Android 模拟器服务
  android-emulator:
    image: budtmo/docker-android:emulator_11.0
    privileged: true
    ports:
      - "5555:5555"  # ADB
      - "6080:6080"  # VNC
    environment:
      - EMULATOR_DEVICE=Samsung Galaxy S10
      - WEB_VNC=true
      - VNC_PASSWORD=password
    volumes:
      - android_data:/root/.android
    networks:
      - app-network

  # Appium 服务
  appium:
    build:
      context: ./backend
      dockerfile: ./appium.Dockerfile
    ports:
      - "4723:4723"
    depends_on:
      - android-emulator
    environment:
      - ANDROID_HOME=/opt/android-sdk
      - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
    volumes:
      - ./scripts:/app/scripts
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4723/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 航班抓取服务
  flight-scraper:
    build:
      context: ./backend
      dockerfile: ./scraper.Dockerfile
    depends_on:
      - web
      - appium
    environment:
      - API_BASE_URL=http://web:8000
      - APPIUM_SERVER_URL=http://appium:4723
    volumes:
      - ./scripts:/app/scripts
      - ./results:/app/results
    networks:
      - app-network
    profiles:
      - scraper

volumes:
  android_data:
  node_cache:    # Node.js依赖缓存卷
  python_cache:  # Python依赖缓存卷

networks:
  app-network:
    driver: bridge
